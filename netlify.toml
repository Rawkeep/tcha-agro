# Netlify: Repo verbinden → sofort deploy-fertig. Statische Seite, kein Build nötig.
[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/karte"
  to = "/visitenkarte.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
