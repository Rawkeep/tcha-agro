<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCHA AGRO Business Center — Visitenkarte / Business Card</title>
  <meta name="description" content="Digitale Visitenkarte der TCHA AGRO Business Center, Togo. Kontakt speichern (vCard), E-Mail schreiben, Website öffnen." />
  <meta name="theme-color" content="#093f39" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body.card-page {
      min-height: 100vh; display: grid; place-items: center;
      background:
        radial-gradient(120% 80% at 80% 0%, #0f5c54 0%, transparent 55%),
        radial-gradient(120% 90% at 0% 100%, #5b2a45 0%, transparent 50%),
        #0b3a35;
      padding: 2rem 1.2rem;
    }
    .card-stage { width: min(100%, 440px); }
    .lang-float { display: flex; justify-content: center; margin-bottom: 1.2rem; }
    .lang-float .lang { background: rgba(246,239,227,.08); border-color: rgba(246,239,227,.2); }
    .lang-float .lang button { color: rgba(246,239,227,.7); }
    .lang-float .lang button.active { background: var(--bone); color: var(--ink); }

    .vcard {
      background: linear-gradient(165deg, #fffdf8, #f3e9d7);
      border-radius: 28px; overflow: hidden; box-shadow: 0 40px 90px -30px rgba(0,0,0,.6);
      position: relative;
    }
    .vcard-top {
      background: linear-gradient(150deg, var(--petrol-deep), var(--petrol));
      padding: 2.2rem 2rem 3.4rem; position: relative; overflow: hidden; color: var(--bone);
    }
    .vcard-top .orbit { position: absolute; right: -70px; top: -50px; width: 240px; height: 240px; opacity: .3; }
    .vcard-top .mark { width: 64px; height: 64px; margin-bottom: 1.1rem; position: relative; z-index: 2; }
    .vcard-top h1 { font-size: 2rem; color: var(--white); position: relative; z-index: 2; }
    .vcard-top .role { font-size: .82rem; letter-spacing: .04em; color: var(--ochre-soft); margin-top: .3rem; position: relative; z-index: 2; max-width: 30ch; }
    .vcard-top .tagline { font-style: italic; font-family: var(--serif); margin-top: .9rem; opacity: .9; position: relative; z-index: 2; font-size: .98rem; }

    .vcard-body { padding: 0 2rem 2rem; margin-top: -2rem; position: relative; z-index: 3; }
    .vrows { background: var(--white); border-radius: 18px; box-shadow: var(--shadow-sm); padding: .5rem; border: 1px solid var(--bone-3); }
    .vrow { display: flex; align-items: center; gap: 1rem; padding: .85rem 1rem; border-radius: 12px; transition: background .25s; }
    .vrow + .vrow { border-top: 1px solid var(--bone-2); }
    .vrow:hover { background: var(--bone); }
    .vrow .vi { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; background: linear-gradient(150deg, var(--clay), var(--clay-deep)); color: var(--bone); }
    .vrow:nth-child(2) .vi { background: linear-gradient(150deg, var(--petrol), var(--petrol-deep)); }
    .vrow:nth-child(3) .vi { background: linear-gradient(150deg, var(--ochre), var(--clay)); }
    .vrow:nth-child(4) .vi { background: linear-gradient(150deg, var(--plum), var(--clay-deep)); }
    .vrow .vi svg { width: 19px; height: 19px; }
    .vrow .vt small { display: block; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
    .vrow .vt span, .vrow .vt a { font-weight: 600; font-size: .98rem; }

    .vactions { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; margin-top: 1.2rem; }
    .vactions .btn { width: 100%; justify-content: center; padding: .85rem 1rem; font-size: .9rem; }
    .vactions .btn.full { grid-column: 1 / -1; }
    .back-link { display: inline-flex; align-items: center; gap: .5rem; color: var(--bone); opacity: .8; font-size: .85rem; margin-top: 1.4rem; justify-content: center; width: 100%; }
    .back-link:hover { opacity: 1; }
    .back-link svg { width: 16px; height: 16px; }
  </style>
</head>
<body class="card-page">
  <div class="card-stage">
    <div class="lang-float">
      <div class="lang" role="group" aria-label="Sprache">
        <button data-lang="de" type="button">DE</button>
        <button data-lang="en" type="button">EN</button>
        <button data-lang="fr" type="button">FR</button>
      </div>
    </div>

    <div class="vcard">
      <div class="vcard-top">
        <svg class="orbit" viewBox="0 0 200 200" fill="none" stroke="#e8c578" stroke-width="1.4" aria-hidden="true">
          <circle cx="100" cy="100" r="80"/><ellipse cx="100" cy="100" rx="80" ry="34"/><ellipse cx="100" cy="100" rx="46" ry="80"/>
        </svg>
        <img class="mark" src="assets/img/logo.svg" alt="TCHA AGRO" />
        <h1>TCHA AGRO</h1>
        <div class="role" data-i18n="card.role">Agrarproduktion & Internationale Handelsagentur</div>
        <div class="tagline" data-i18n="card.tagline">Vom Feld in Togo bis vor Ihre Tür — weltweit.</div>
      </div>

      <div class="vcard-body">
        <div class="vrows">
          <div class="vrow">
            <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h3l2 5-2 1c1 3 3 5 6 6l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z" stroke-linejoin="round"/></svg></div>
            <div class="vt"><small data-i18n="contact.phone">Telefon</small><a href="tel:+228" class="ph">[Telefonnummer] (+228)</a></div>
          </div>
          <div class="vrow">
            <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="vt"><small data-i18n="contact.email">E-Mail</small><a href="mailto:[E-Mail]" class="ph">[E-Mail-Adresse]</a></div>
          </div>
          <div class="vrow">
            <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.5"/></svg></div>
            <div class="vt"><small data-i18n="contact.address">Adresse</small><span class="ph" data-i18n="contact.addressval">[Straße & Nr.], Lomé, Togo</span></div>
          </div>
          <div class="vrow">
            <div class="vi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg></div>
            <div class="vt"><small data-i18n="contact.reg">Registrierung</small><span class="ph">SNIF: [SNIF-Nummer]</span></div>
          </div>
        </div>

        <div class="vactions">
          <a href="assets/tcha-agro.vcf" download class="btn btn-petrol full">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:18px;height:18px"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="card.save">Kontakt speichern (vCard)</span>
          </a>
          <a href="mailto:[E-Mail]" class="btn btn-ghost" data-i18n="card.write">E-Mail schreiben</a>
          <a href="index.html" class="btn btn-primary" data-i18n="card.web">Website öffnen</a>
        </div>
      </div>
    </div>

    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="card.back">Zur Website</span>
    </a>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
